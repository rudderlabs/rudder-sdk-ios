name: Draft new Beta release

on:
  workflow_dispatch:
    inputs:
      beta_version:
        description: "Beta version(Only single digit, example: 1)"
        required: true

permissions:
  contents: read

jobs:
  draft-new-beta-release:
    name: Draft a new Beta release
    runs-on: macOS-latest
    if: startsWith(github.ref, 'refs/heads/fix/') || startsWith(github.ref, 'refs/heads/feat/') || startsWith(github.ref, 'refs/heads/feature/')
    permissions:
      contents: read # GITHUB_TOKEN only needs read access
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42 # v2.1.4
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PRIVATE_KEY }}
          repositories: rudder-sdk-ios,Specs
          permission-contents: write # to create commits, tags, and push branches
          permission-pull-requests: write # to create and update PRs

      - name: Checkout source branch
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          token: ${{ steps.generate-token.outputs.token }}
          fetch-depth: 0

      - name: Set Node 16
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 16
          
      # Calculate the next release version based on conventional semantic release
      - name: Calculate release version
        id: create-release
        env:
          HUSKY: 0
        run: |
          source_branch_name=${GITHUB_REF##*/}
          release_type=beta-release
          git fetch origin master
          git fetch --tags origin
          git merge origin/master
          current_version=$(jq -r .version package.json)

          npx standard-version --skip.commit --skip.tag --skip.changelog
          new_version="$(jq -r .version package.json).beta.${{ github.event.inputs.beta_version }}"
          git reset --hard

          branch_name="${release_type}/${new_version}"

          echo "Source branch for new release is $source_branch_name"
          echo "Current version is $current_version"
          echo "Release type is $release_type"
          echo "New version is $new_version"
          echo "New release branch name is $branch_name"

          echo "source_branch_name=$source_branch_name" >> $GITHUB_OUTPUT
          echo "branch_name=$branch_name" >> $GITHUB_OUTPUT
          echo "new_version=$new_version" >> $GITHUB_OUTPUT
          echo "CURRENT_VERSION_VALUE=$current_version" >> $GITHUB_ENV
          echo "NEW_VERSION_VALUE=$new_version" >> $GITHUB_ENV

      - name: Create release branch via GitHub API
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          BASE_SHA=$(git rev-parse origin/master)
          gh api repos/${{ github.repository }}/git/refs \
            --method POST \
            -f ref="refs/heads/${{ steps.create-release.outputs.branch_name }}" \
            -f sha="$BASE_SHA"

      - name: Bump version
        id: finish-release
        env:
          HUSKY: 0
        run: |
          echo "Current version: $CURRENT_VERSION_VALUE"
          echo "New version: $NEW_VERSION_VALUE"
          npx replace $CURRENT_VERSION_VALUE $NEW_VERSION_VALUE Sources/Classes/Headers/RSVersion.h package.json
          echo ${{ steps.create-release.outputs.new_version }}
          echo "commit_summary=$SUMMARY" >> $GITHUB_OUTPUT

      - name: Create verified commit via API
        uses: ryancyq/github-signed-commit@e9f3b28c80da7be66d24b8f501a5abe82a6b855f # v1.2.0
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        with:
          branch-name: ${{ steps.create-release.outputs.branch_name }}
          commit-message: 'chore(beta-release): v${{ env.NEW_VERSION_VALUE }}'
          files: |
            Sources/Classes/Headers/RSVersion.h
            package.json
          tag: 'v${{ env.NEW_VERSION_VALUE }}'

      - name: 'Checkout'
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: '${{ steps.create-release.outputs.branch_name }}'

      - name: 'Install Cocoapods'
        run: gem install cocoapods

      - name: 'Convert podspec to podspec.json'
        run: |
          pod ipc spec Rudder.podspec > Rudder.podspec.json

      - name: 'Add Private Spec Repo to CocoaPods installation'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          pod repo add rudderlabs https://x-access-token:${GH_TOKEN}@github.com/rudderlabs/Specs.git

      - name: 'Add Podspec to local private Spec repo'
        run: |
          pod repo push rudderlabs Rudder.podspec.json --allow-warnings --local-only

      - name: 'Create private Specs PR'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          set -euo pipefail

          pod_version="$(jq -r .version package.json)"
          pr_title="deploy: Rudder ${pod_version}"
          specs_repo="${HOME}/.cocoapods/repos/rudderlabs"

          cd "$specs_repo"

          if ! git diff --quiet origin/master...HEAD; then
            existing_pr="$(gh pr list --repo rudderlabs/Specs --state open --json title,url | jq -r --arg title "$pr_title" '.[] | select(.title == $title) | .url' | head -n 1)"
            if [ -n "$existing_pr" ]; then
              echo "A Specs PR already exists for Rudder ${pod_version}: $existing_pr"
              exit 0
            fi

            branch_name="deploy/rudder-${pod_version}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            git checkout -B "$branch_name"
            git push origin "HEAD:refs/heads/${branch_name}"

            gh pr create \
              --repo rudderlabs/Specs \
              --base master \
              --head "$branch_name" \
              --title "$pr_title" \
              --body "Adds Rudder ${pod_version} to the private CocoaPods Specs repo.

          Created by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. A human review is required by the Specs repository ruleset before merge."
          else
            echo "No private Specs changes detected for Rudder ${pod_version}."
          fi
