name: Publish new github release(v2)

on:
  pull_request:
    branches:
      - master-v2
    types:
      - closed

jobs:
  release:
    name: Publish new release(v2)
    runs-on: ubuntu-latest
    if: (startsWith(github.event.pull_request.head.ref, 'release/') || startsWith(github.event.pull_request.head.ref, 'hotfix-v2-release/')) && github.event.pull_request.merged == true # only merged pull requests must trigger this job
    permissions:
      contents: read # GITHUB_TOKEN only needs read access
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42 # v2.1.4
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PRIVATE_KEY }}
          repositories: rudder-sdk-ios
          permission-contents: write # to create releases and tags
          permission-pull-requests: write # to create and update PRs

      - name: Extract version from branch name (for release branches)
        id: extract-version
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          VERSION="${BRANCH_NAME#hotfix-}"
          VERSION="${VERSION#release/}"
          echo "release_version=$VERSION" >> $GITHUB_OUTPUT

      - name: Checkout source branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ steps.generate-token.outputs.token }}
          fetch-depth: 0

      - name: Set Node 16
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 16

      - name: Create Github Release
        id: create_release
        env:
          HUSKY: 0
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
          CONVENTIONAL_GITHUB_RELEASER_TOKEN: ${{ steps.generate-token.outputs.token }}
          RELEASE_VERSION: ${{ steps.extract-version.outputs.release_version }}
        run: |
          git for-each-ref refs/tags
          git tag --delete "$RELEASE_VERSION"
          git push --delete origin "$RELEASE_VERSION"
          git tag -a "v${RELEASE_VERSION}" -m "chore: release v${RELEASE_VERSION}"
          git push origin "refs/tags/v${RELEASE_VERSION}"
          DEBUG=conventional-github-releaser npx conventional-github-releaser -p angular --config github-release.config.js

      - name: Create pull request into develop
        uses: repo-sync/pull-request@7e79a9f5dc3ad0ce53138f01df2fad14a04831c5 #v2
        with:
          source_branch: 'master-v2'
          destination_branch: 'develop-v2'
          github_token: ${{ steps.generate-token.outputs.token }}
          pr_title: "chore(release): pulling master into develop post release v${{ steps.extract-version.outputs.release_version }}"
          pr_body: ':crown: *An automated PR*'

      - name: Delete hotfix release branch
        uses: koj-co/delete-merged-action@63a03c35810a8a7d4840d18793c0f68ff8b59450 # master
        if: startsWith(github.event.pull_request.head.ref, 'hotfix-v2-release/')
        with:
          branches: 'hotfix-v2-release/*'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete release branch
        uses: koj-co/delete-merged-action@63a03c35810a8a7d4840d18793c0f68ff8b59450 # master
        if: startsWith(github.event.pull_request.head.ref, 'release/')
        with:
          branches: 'release/*'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
