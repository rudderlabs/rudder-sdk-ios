# The active v1 SDK preserves develop -> master -> develop.
# This workflow promotes code only; release-please owns versioning and releases.

name: Promote v1 Release Candidate

on: workflow_dispatch

permissions:
  contents: read

jobs:
  promote-release-candidate:
    name: Promote v1 release candidate to master
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/heads/develop') || startsWith(github.ref, 'refs/heads/hotfix/')
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Generate GitHub App token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout source branch
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          token: ${{ steps.generate-token.outputs.token }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate releasable changes
        run: |
          git fetch --no-tags origin master
          if ! git merge-base --is-ancestor origin/master HEAD; then
            echo "${GITHUB_REF_NAME} does not contain the current master branch."
            exit 1
          fi

          commit_count=$(git rev-list --count origin/master..HEAD)
          if [[ "$commit_count" -eq 0 ]]; then
            echo "No commits are available to promote."
            exit 1
          fi

      - name: Create promotion branch and pull request
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          branch_type=release
          if [[ "$GITHUB_REF_NAME" == hotfix/* ]]; then
            branch_type=hotfix
          fi

          branch_name="${branch_type}/candidate-${GITHUB_RUN_ID}"
          source_sha=$(git rev-parse HEAD)
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch_name}" >/dev/null 2>&1; then
            gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
              --method POST \
              -f ref="refs/heads/${branch_name}" \
              -f sha="$source_sha"
          fi

          existing_pr=$(gh pr list \
            --base master \
            --head "$branch_name" \
            --state all \
            --json number \
            --jq '.[0].number // empty')
          if [[ -n "$existing_pr" ]]; then
            echo "Promotion PR #${existing_pr} already exists."
            exit 0
          fi

          gh pr create \
            --base master \
            --head "$branch_name" \
            --title "chore(release): promote ${GITHUB_REF_NAME} to master" \
            --body "Promotes the v1 release candidate without changing versions or creating tags. release-please will maintain the version/changelog PR after merge."
