name: Deploy to Private Pod

on:
  pull_request:
    branches:
      - master
    types:
      - opened
  
permissions:
  contents: read

jobs:
  deploy_private_pod:
    name: Deploy to Private Pod
    runs-on: macOS-latest
    if: (startsWith(github.event.pull_request.head.ref, 'release/') || startsWith(github.event.pull_request.head.ref, 'hotfix-release/'))
    permissions:
      contents: read # GITHUB_TOKEN only needs read access
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@95d9a5deda9de15063e7595e9719c11c38c90ae2 # v2.13.2
        with:
          egress-policy: audit

      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42 # v2.1.4
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PRIVATE_KEY }}
          repositories: rudder-sdk-ios,Specs
          permission-contents: write # to push to private Specs repo

      - name: 'Checkout'
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          token: ${{ steps.generate-token.outputs.token }}
          ref: '${{ github.event.pull_request.head.ref }}'
    
      - name: 'Install Cocoapods'
        run: gem install cocoapods
        
      - name: 'Convert podspec to podspec.json'
        run: |
          pod ipc spec Rudder.podspec > Rudder.podspec.json

      - name: 'Add Private Spec Repo to CocoaPods installation'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          pod repo add rudderlabs https://x-access-token:${GH_TOKEN}@github.com/rudderlabs/Specs.git
        
      - name: 'Add Podspec to repo'
        run: |
          pod repo push rudderlabs Rudder.podspec.json --allow-warnings
