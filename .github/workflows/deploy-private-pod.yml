name: Deploy to Private Pod

on:
  pull_request:
    branches:
      - master
    types:
      - opened
  
permissions:
  contents: read

jobs:
  deploy_private_pod:
    name: Deploy to Private Pod
    runs-on: macOS-latest
    if: (startsWith(github.event.pull_request.head.ref, 'release/') || startsWith(github.event.pull_request.head.ref, 'hotfix-release/'))
    permissions:
      contents: read # GITHUB_TOKEN only needs read access
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42 # v2.1.4
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PRIVATE_KEY }}
          repositories: rudder-sdk-ios,Specs
          permission-contents: write # to push branches in private Specs repo
          permission-pull-requests: write # to create PRs in private Specs repo

      - name: 'Checkout'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ steps.generate-token.outputs.token }}
          ref: '${{ github.event.pull_request.head.ref }}'
    
      - name: 'Install Cocoapods'
        run: gem install cocoapods
        
      - name: 'Convert podspec to podspec.json'
        run: |
          pod ipc spec Rudder.podspec > Rudder.podspec.json

      - name: 'Add Private Spec Repo to CocoaPods installation'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          pod repo add rudderlabs https://x-access-token:${GH_TOKEN}@github.com/rudderlabs/Specs.git
        
      - name: 'Add Podspec to local private Spec repo'
        run: |
          pod repo push rudderlabs Rudder.podspec.json --allow-warnings --local-only

      - name: 'Create private Specs PR'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          bash Scripts/create-private-specs-pr.sh
