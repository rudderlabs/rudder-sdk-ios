name: Post v1 Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate:
    name: Validate v1 release
    runs-on: ubuntu-latest
    outputs:
      is-v1: ${{ steps.release.outputs.is-v1 }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout master
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Check tag ancestry
        id: release
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "is-v1=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          if git merge-base --is-ancestor "${TAG}^{commit}" HEAD; then
            echo "is-v1=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-v1=false" >> "$GITHUB_OUTPUT"
          fi

  back-merge:
    name: Back-merge master into develop
    needs: validate
    if: needs.validate.outputs.is-v1 == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Generate GitHub App token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Raise back-merge pull request
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          existing_pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --base develop --head master --state open --json url --jq '.[0].url // empty')
          if [[ -n "$existing_pr" ]]; then
            echo "Back-merge pull request already exists: $existing_pr"
            exit 0
          fi
          gh pr create --repo "$GITHUB_REPOSITORY" --base develop --head master \
            --title "chore(release): pulling master into develop post release $VERSION" \
            --body "Automated v1 post-release back-merge."

  xcframework:
    name: Generate and upload XCFramework
    needs: validate
    if: needs.validate.outputs.is-v1 == 'true'
    runs-on: macos-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Generate GitHub App token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Checkout release tag
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          token: ${{ steps.generate-token.outputs.token }}
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - run: gem install xcpretty cocoapods
      - run: pod install --repo-update
      - run: sh ./scripts/generate-xcframework.sh

      - name: Upload release artifacts
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          zip -r Rudder-xcframeworks.zip xcframeworks
          shasum -a 256 Rudder-xcframeworks.zip > Rudder-xcframeworks.sha256
          gh release upload "$TAG" Rudder-xcframeworks.zip Rudder-xcframeworks.sha256
